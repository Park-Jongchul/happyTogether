<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#21A3A4">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="행복하자 우리 (Happy Together) — 돌싱의 일상·친목·모임·대화를 연결하는 커뮤니티">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>행복하자 우리 · Happy Together</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/screens.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2321A3A4'/><text y='72' x='50' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'>행</text></svg>">
</head>
<body>

<!-- D01 스플래시 -->
<div id="splash" class="splash">
  <div class="splash-bg"></div>
  <div class="splash-inner">
    <div class="splash-logo">행</div>
    <h1 class="splash-title">행복하자 우리</h1>
    <p class="splash-sub">두 번째 시작,<br>함께라서 더 편안하게</p>
  </div>
  <div class="splash-foot">
    <div class="splash-bar"><i></i></div>
    <span>Happy Together</span>
  </div>
</div>

<!-- 앱 셸 -->
<div id="app" class="app" hidden>
  <header id="appbar" class="appbar"></header>
  <main id="view" class="view" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar"></nav>
</div>

<!-- 전체메뉴 D23 -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-dim" data-close-drawer></div>
  <aside class="drawer-panel" role="dialog" aria-label="전체메뉴"></aside>
</div>

<!-- 바텀시트 (가입유도 D18 / 정회원안내 D19 / 필터 등) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-dim" data-close-sheet></div>
  <section class="sheet-panel" role="dialog" aria-modal="true"></section>
</div>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/screens-main.js"></script>
<script src="assets/js/screens-auth.js"></script>
<script src="assets/js/screens-meet.js"></script>
<script src="assets/js/screens-community.js"></script>
<script src="assets/js/screens-social.js"></script>
<script src="assets/js/screens-my.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
